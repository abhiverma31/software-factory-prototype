name: Deploy Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  DJANGO_ECR_REPOSITORY: software-factory-dev-django
  WORKER_ECR_REPOSITORY: software-factory-dev-worker
  LAMBDA_FUNCTION_NAME: software-factory-dev-django
  ROLE_TO_ASSUME: arn:aws:iam::468052945891:role/software-factory-dev-github-actions-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Django image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t "$ECR_REGISTRY/$DJANGO_ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$DJANGO_ECR_REPOSITORY:latest" \
            --push .

      - name: Build and push worker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -f Dockerfile.worker \
            -t "$ECR_REGISTRY/$WORKER_ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$WORKER_ECR_REPOSITORY:latest" \
            --push .

      - name: Update Lambda image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$DJANGO_ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"
