name: Factory Issue

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      task:
        description: Factory task text
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  start-factory:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'factory'
    runs-on: ubuntu-latest

    steps:
      - name: Build factory request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              task = os.environ["MANUAL_TASK"].strip()
              context = {"source": "github_workflow_dispatch"}
          else:
              issue_title = os.environ["ISSUE_TITLE"].strip()
              issue_body = os.environ["ISSUE_BODY"].strip()
              task = f"{issue_title}\n\n{issue_body}".strip()
              context = {
                  "source": "github_issue",
                  "issue_number": os.environ["ISSUE_NUMBER"],
                  "issue_title": issue_title,
                  "issue_body": issue_body,
                  "issue_url": os.environ["ISSUE_URL"],
                  "issue_author": os.environ["ISSUE_AUTHOR"],
              }

          Path("factory-request.json").write_text(
              json.dumps({"task": task, "context": context}, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Start software factory
        env:
          FACTORY_LAMBDA_URL: ${{ secrets.FACTORY_LAMBDA_URL }}
        run: |
          if [ -z "$FACTORY_LAMBDA_URL" ]; then
            echo "FACTORY_LAMBDA_URL repository secret is required."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data @factory-request.json \
            "${FACTORY_LAMBDA_URL%/}/factory/fix/" \
            --output factory-start-response.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path("factory-start-response.json").read_text(encoding="utf-8"))
          job_id = response["job_id"]
          state = response["state"]
          print(f"Factory started with job_id={job_id}, state={state}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FACTORY_JOB_ID={job_id}\n")
          PY

      - name: Wait for software factory
        env:
          FACTORY_LAMBDA_URL: ${{ secrets.FACTORY_LAMBDA_URL }}
          FACTORY_TIMEOUT_SECONDS: "900"
          FACTORY_POLL_SECONDS: "10"
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          base_url = os.environ["FACTORY_LAMBDA_URL"].rstrip("/")
          job_id = os.environ["FACTORY_JOB_ID"]
          timeout_seconds = int(os.environ["FACTORY_TIMEOUT_SECONDS"])
          poll_seconds = int(os.environ["FACTORY_POLL_SECONDS"])
          deadline = time.monotonic() + timeout_seconds

          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({"job_id": job_id})
              with urllib.request.urlopen(f"{base_url}/factory/status/?{query}", timeout=20) as response:
                  status = json.loads(response.read().decode("utf-8"))

              state = status.get("state", "unknown")
              detail = status.get("detail", "")
              print(f"Factory status: {state}. {detail}")

              if state == "completed":
                  pull_request_url = status.get("pull_request_url")
                  if pull_request_url:
                      print(f"Pull request: {pull_request_url}")
                  sys.exit(0)

              if state == "failed":
                  print(json.dumps(status, indent=2))
                  sys.exit(1)

              time.sleep(poll_seconds)

          print(f"Timed out waiting for factory job {job_id}.")
          sys.exit(1)
          PY
